<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국판 포켓몬 카드 시세</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f7f6f2; color: #1a1a1a; min-height: 100vh; }

  header { background: #fff; border-bottom: 1px solid #e8e6e0; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; }
  header span { font-size: 13px; color: #888; }

  .container { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .stat { background: #fff; border-radius: 12px; padding: 1rem 1.25rem; border: 1px solid #e8e6e0; }
  .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .stat-val { font-size: 24px; font-weight: 700; }

  .tabs { display: flex; gap: 8px; margin-bottom: 1.25rem; }
  .tab { padding: 8px 20px; border: 1px solid #ddd; border-radius: 8px; background: transparent; font-size: 14px; color: #666; cursor: pointer; transition: all 0.15s; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .section { display: none; }
  .section.active { display: block; }

  .search-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .search-row input, .search-row select { height: 38px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font-size: 14px; background: #fff; color: #1a1a1a; outline: none; }
  .search-row input { flex: 1; min-width: 160px; }
  .search-row input:focus, .search-row select:focus { border-color: #aaa; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #e8e6e0; border-radius: 12px; padding: 1rem; transition: box-shadow 0.15s; }
  .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .card-name { font-size: 15px; font-weight: 600; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; }
  .badge-ex { background: #ede9fe; color: #5b21b6; }
  .badge-v { background: #dbeafe; color: #1e40af; }
  .badge-holo { background: #fef3c7; color: #92400e; }
  .badge-basic { background: #f1f5f9; color: #475569; }
  .card-set { font-size: 12px; color: #888; margin-bottom: 10px; }
  .price-row { display: flex; justify-content: space-between; align-items: center; }
  .price { font-size: 18px; font-weight: 700; }
  .price-change { font-size: 12px; font-weight: 600; }
  .up { color: #dc2626; }
  .down { color: #16a34a; }
  .flat { color: #aaa; }
  .price-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .card-date { font-size: 11px; color: #ccc; margin-top: 8px; }
  .empty { text-align: center; padding: 3rem; color: #aaa; font-size: 14px; }

  .form-card { background: #fff; border: 1px solid #e8e6e0; border-radius: 14px; padding: 1.5rem; max-width: 520px; }
  .form-row { margin-bottom: 1rem; }
  .form-row label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; height: 40px; border: 1px solid #ddd; border-radius: 8px;
    padding: 0 12px; font-size: 14px; background: #fff; color: #1a1a1a; outline: none;
    font-family: inherit;
  }
  .form-row textarea { height: 72px; resize: vertical; padding: 10px 12px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #999; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .submit-btn {
    width: 100%; padding: 12px; background: #1a1a1a; color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 4px; font-family: inherit;
    transition: background 0.15s;
  }
  .submit-btn:hover { background: #333; }
  .success-msg { display: none; font-size: 14px; color: #16a34a; margin-top: 10px; text-align: center; }
  .error-msg { font-size: 12px; color: #dc2626; margin-top: 4px; display: none; }
</style>
</head>
<body>

<header>
  <h1>🃏 한국판 포켓몬 카드 시세</h1>
  <span>실제 거래 기반 시세 정보</span>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-label">등록 카드</div><div class="stat-val" id="total-cards">0</div></div>
    <div class="stat"><div class="stat-label">오늘 등록</div><div class="stat-val" id="today-count">0</div></div>
    <div class="stat"><div class="stat-label">최근 업데이트</div><div class="stat-val" id="last-update">—</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('view')">시세 조회</button>
    <button class="tab" onclick="switchTab('add')">시세 등록</button>
  </div>

  <div id="view" class="section active">
    <div class="search-row">
      <input type="text" id="search" placeholder="카드 이름 검색..." oninput="filterCards()" />
      <select id="filter-set" onchange="filterCards()">
        <option value="">전체 세트</option>
        <option>스칼렛&amp;바이올렛</option>
        <option>팔데아의 진화</option>
        <option>흑염의 지배자</option>
        <option>시간의 격돌</option>
        <option>기타</option>
      </select>
      <select id="filter-grade" onchange="filterCards()">
        <option value="">전체 등급</option>
        <option>ex</option>
        <option>V</option>
        <option>홀로</option>
        <option>일반</option>
      </select>
    </div>
    <div class="card-grid" id="card-grid"></div>
  </div>

  <div id="add" class="section">
    <div class="form-card">
      <div class="form-row">
        <label>카드 이름 *</label>
        <input type="text" id="f-name" placeholder="예: 리자몽 ex" />
        <div class="error-msg" id="err-name">카드 이름을 입력해주세요.</div>
      </div>
      <div class="two-col">
        <div class="form-row">
          <label>세트명</label>
          <select id="f-set">
            <option>스칼렛&amp;바이올렛</option>
            <option>팔데아의 진화</option>
            <option>흑염의 지배자</option>
            <option>시간의 격돌</option>
            <option>기타</option>
          </select>
        </div>
        <div class="form-row">
          <label>카드 등급</label>
          <select id="f-grade">
            <option>ex</option>
            <option>V</option>
            <option>홀로</option>
            <option>일반</option>
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="form-row">
          <label>시세 (원) *</label>
          <input type="number" id="f-price" placeholder="예: 15000" min="0" />
          <div class="error-msg" id="err-price">시세를 입력해주세요.</div>
        </div>
        <div class="form-row">
          <label>거래처</label>
          <select id="f-source">
            <option>번개장터</option>
            <option>중고나라</option>
            <option>네이버 카페</option>
            <option>직거래</option>
            <option>기타</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>메모 (선택)</label>
        <textarea id="f-memo" placeholder="카드 상태, 특이사항 등..."></textarea>
      </div>
      <button class="submit-btn" onclick="addCard()">시세 등록하기</button>
      <div class="success-msg" id="success-msg">✓ 등록되었습니다!</div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'pokemon_prices';
const gradeClass = { 'ex': 'badge-ex', 'V': 'badge-v', '홀로': 'badge-holo', '일반': 'badge-basic' };

const sampleCards = [
  { name: '리자몽 ex', set: '흑염의 지배자', grade: 'ex', price: 28000, change: 12, source: '번개장터', date: today() },
  { name: '피카츄 V', set: '스칼렛&바이올렛', grade: 'V', price: 9500, change: -5, source: '중고나라', date: today() },
  { name: '이브이 홀로', set: '팔데아의 진화', grade: '홀로', price: 4200, change: 0, source: '네이버 카페', date: yesterday() },
  { name: '뮤츠 ex', set: '시간의 격돌', grade: 'ex', price: 35000, change: 8, source: '번개장터', date: yesterday() },
  { name: '루카리오 V', set: '스칼렛&바이올렛', grade: 'V', price: 7800, change: -3, source: '직거래', date: yesterday() },
  { name: '게코가 일반', set: '팔데아의 진화', grade: '일반', price: 800, change: 0, source: '중고나라', date: yesterday() },
];

function today() {
  const d = new Date();
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}
function yesterday() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}
function p(n) { return String(n).padStart(2,'0'); }

function loadCards() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : sampleCards;
  } catch(e) { return sampleCards; }
}
function saveCards(cards) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch(e) {}
}

let cards = loadCards();

function priceStr(n) { return Number(n).toLocaleString() + '원'; }
function changeStr(c) {
  if (c > 0) return `<span class="price-change up">▲ ${c}%</span>`;
  if (c < 0) return `<span class="price-change down">▼ ${Math.abs(c)}%</span>`;
  return `<span class="price-change flat">—</span>`;
}

function renderCards(list) {
  const grid = document.getElementById('card-grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">등록된 시세가 없습니다.</div>';
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="card">
      <div class="card-top">
        <div class="card-name">${c.name}</div>
        <span class="badge ${gradeClass[c.grade] || 'badge-basic'}">${c.grade}</span>
      </div>
      <div class="card-set">${c.set}</div>
      <div class="price-row">
        <div>
          <div class="price">${priceStr(c.price)}</div>
          <div class="price-sub">${c.source}</div>
        </div>
        ${changeStr(c.change)}
      </div>
      <div class="card-date">${c.date} 기준</div>
    </div>
  `).join('');
}

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  const set = document.getElementById('filter-set').value;
  const grade = document.getElementById('filter-grade').value;
  const filtered = cards.filter(c =>
    (!q || c.name.toLowerCase().includes(q)) &&
    (!set || c.set === set) &&
    (!grade || c.grade === grade)
  );
  renderCards(filtered);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['view','add'][i] === tab));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
}

function addCard() {
  const name = document.getElementById('f-name').value.trim();
  const price = parseInt(document.getElementById('f-price').value);
  let valid = true;

  document.getElementById('err-name').style.display = name ? 'none' : 'block';
  document.getElementById('err-price').style.display = (!isNaN(price) && price > 0) ? 'none' : 'block';
  if (!name || isNaN(price) || price <= 0) return;

  cards.unshift({
    name,
    set: document.getElementById('f-set').value,
    grade: document.getElementById('f-grade').value,
    price,
    change: 0,
    source: document.getElementById('f-source').value,
    memo: document.getElementById('f-memo').value,
    date: today(),
  });
  saveCards(cards);

  document.getElementById('f-name').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-memo').value = '';

  const msg = document.getElementById('success-msg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 2500);
  updateStats();
}

function updateStats() {
  document.getElementById('total-cards').textContent = cards.length;
  const t = today();
  document.getElementById('today-count').textContent = cards.filter(c => c.date === t).length;
  document.getElementById('last-update').textContent = cards.length ? cards[0].date.slice(5) : '—';
}

renderCards(cards);
updateStats();
</script>
</body>
</html>
